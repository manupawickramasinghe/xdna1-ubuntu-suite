[package]
name = "npu-face"
version = "0.1.0"
edition = "2021"
description = "Face embedding CNNs (ONNX) with conv/FC matmuls on the AMD XDNA NPU via XRT"
license = "MIT"

[dependencies]
anyhow = "1"
prost = "0.13"
rayon = "1.10"

[build-dependencies]
cc = "1"
prost-build = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
